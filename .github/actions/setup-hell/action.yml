name: Setup Hell
description: Set up Hell for CI use — pre-built binary on Linux, built from source on macOS

inputs:
  hell-version:
    description: Hell release tag to build (from .hell-version)
    required: true

runs:
  using: composite
  steps:
    - name: Restore Hell binary cache
      uses: actions/cache/restore@v4
      id: hell-cache
      with:
        path: ~/.local/bin/hell
        key: hell-${{ runner.os }}-${{ runner.arch }}-ghc9.8-${{ inputs.hell-version }}

    - name: Create install directory
      if: steps.hell-cache.outputs.cache-hit != 'true'
      shell: bash
      run: mkdir -p ~/.local/bin

    # --- Linux: download pre-built binary from upstream ---

    - name: Download Hell binary
      if: runner.os == 'Linux' && steps.hell-cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL -o "$HOME/.local/bin/hell" "https://github.com/chrisdone/hell/releases/download/${{ inputs.hell-version }}/hell-linux-amd64"

    # --- macOS: build from source ---

    - name: Setup GHC and Cabal
      if: runner.os != 'Linux' && steps.hell-cache.outputs.cache-hit != 'true'
      uses: haskell-actions/setup@v2
      with:
        ghc-version: "9.8"
        cabal-version: "latest"

    - name: Checkout Hell source
      if: runner.os != 'Linux' && steps.hell-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: chrisdone/hell
        ref: ${{ inputs.hell-version }}
        path: _hell-src

    - name: Restore Cabal store cache
      if: runner.os != 'Linux' && steps.hell-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      id: cabal-cache
      with:
        path: ~/.cabal/store
        key: cabal-${{ runner.os }}-${{ runner.arch }}-ghc9.8-${{ inputs.hell-version }}
        restore-keys: |
          cabal-${{ runner.os }}-${{ runner.arch }}-ghc9.8-

    - name: Update Cabal package index
      if: runner.os != 'Linux' && steps.hell-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: _hell-src
      run: cabal update

    - name: Build Hell
      if: runner.os != 'Linux' && steps.hell-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: _hell-src
      run: cabal build exe:hell -O2

    - name: Install Hell binary
      if: runner.os != 'Linux' && steps.hell-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: _hell-src
      run: cabal install --install-method=copy --installdir=$HOME/.local/bin exe:hell

    # --- Shared: finalize ---

    - name: Make Hell executable
      if: steps.hell-cache.outputs.cache-hit != 'true'
      shell: bash
      run: chmod +x ~/.local/bin/hell

    - name: Save Hell binary cache
      if: steps.hell-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.local/bin/hell
        key: ${{ steps.hell-cache.outputs.cache-primary-key }}

    - name: Clean up Hell source
      if: runner.os != 'Linux' && steps.hell-cache.outputs.cache-hit != 'true'
      shell: bash
      run: rm -rf _hell-src

    - name: Save Cabal store cache
      if: always() && runner.os != 'Linux' && steps.hell-cache.outputs.cache-hit != 'true' && steps.cabal-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cabal/store
        key: ${{ steps.cabal-cache.outputs.cache-primary-key }}

    # Bootstrap: GITHUB_PATH requires a shell redirect — there is no
    # single-command alternative in composite actions.
    - name: Add Hell to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
