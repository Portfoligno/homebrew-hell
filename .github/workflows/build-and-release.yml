name: Build and release

on:
  workflow_call:
    inputs:
      upstream-tag:
        required: true
        type: string
    secrets:
      DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      upstream-tag:
        description: "Hell upstream tag to build (e.g. 2026-05-02)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-${{ inputs.upstream-tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Setup GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8"
          cabal-version: "latest"

      - name: Checkout Hell source
        uses: actions/checkout@v4
        with:
          repository: chrisdone/hell
          ref: ${{ inputs.upstream-tag }}

      - name: Restore Cabal store cache
        uses: actions/cache/restore@v4
        id: cabal-cache
        with:
          path: ~/.cabal/store
          key: cabal-${{ runner.os }}-${{ runner.arch }}-ghc9.8-${{ inputs.upstream-tag }}
          restore-keys: cabal-${{ runner.os }}-${{ runner.arch }}-ghc9.8-

      - name: Update Cabal package index
        run: cabal update

      - name: Build and install Hell binary
        run: cabal install exe:hell -O2 --install-method=copy --overwrite-policy=always --installdir=_archive

      - name: Strip binary
        run: strip _archive/hell

      - name: Make binary executable
        run: chmod +x _archive/hell

      - name: Create tarball
        env:
          TARGET: ${{ matrix.target }}
        run: tar -czf hell-"$TARGET".tar.gz -C _archive hell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hell-${{ matrix.target }}
          path: hell-${{ matrix.target }}.tar.gz

      - name: Save Cabal store cache
        if: always() && steps.cabal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cabal/store
          key: ${{ steps.cabal-cache.outputs.cache-primary-key }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
          merge-multiple: true

      - name: Check if release exists
        id: check-release
        run: gh release view "$UPSTREAM_TAG" --json tagName --jq .tagName
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ inputs.upstream-tag }}

      - name: Create GitHub Release
        if: steps.check-release.outcome == 'failure'
        run: gh release create "$UPSTREAM_TAG" _artifacts/*.tar.gz --title "$UPSTREAM_TAG" --notes "Built from [chrisdone/hell@$UPSTREAM_TAG](https://github.com/chrisdone/hell/releases/tag/$UPSTREAM_TAG)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ inputs.upstream-tag }}

      - name: Upload assets to existing release
        if: steps.check-release.outcome == 'success'
        run: gh release upload --clobber "$UPSTREAM_TAG" _artifacts/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ inputs.upstream-tag }}

  trigger-formula:
    needs: release
    uses: ./.github/workflows/update-formula.yml
    with:
      version: ${{ inputs.upstream-tag }}
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
