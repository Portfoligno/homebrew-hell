name: Update formula

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Hell version to update formula to (e.g. 2026-05-02)"
        required: true
        type: string

concurrency:
  group: update-formula

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # Bootstrap: read .hell-version for the composite action.
      - name: Read Hell version
        id: read-version
        shell: bash
        run: printf 'hell-version=%s\n' "$(cat .hell-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Hell
        uses: ./.github/actions/setup-hell
        with:
          hell-version: ${{ steps.read-version.outputs.hell-version }}

      - name: Update formula
        run: ./scripts/update-formula.hell "$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}

      - name: Configure git user
        uses: Homebrew/actions/git-user-config@master

      - name: Create update branch
        run: git checkout -b "update/$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Stage formula
        run: git add Formula/hell.rb

      - name: Commit formula update
        run: git commit -m "hell $VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Push update branch
        run: git push --force-with-lease origin "update/$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Create pull request
        run: gh pr create --title "hell $VERSION" --body "Automated formula update for Hell [$VERSION](https://github.com/chrisdone/hell/releases/tag/$VERSION)." --base main --head "update/$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}

      - name: Merge pull request
        run: gh pr merge --squash --delete-branch "update/$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
